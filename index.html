<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@300;400;500&family=Syncopate:wght@400;700&display=swap">
<style>
/* Layout: gallery-black surface, hairline rules, square edges; selection shown by inversion (white on black). Single dark theme by choice (photo editing). */
:root {
  --body: #0a0a0a;
  --panel: #0a0a0a;
  --line: #262626;
  --fg: #f3f2ef;
  --mute: #767573;
  --accent: #f3f2ef;
  --accent-ink: #0a0a0a;
  --display: "Syncopate", "Helvetica Neue", Arial, sans-serif;
  --sans: "IBM Plex Sans KR", "Apple SD Gothic Neo", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--body); color: var(--fg); }
body {
  font-family: var(--sans);
  font-size: 15px;
  font-weight: 300;
  line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 28px;
  -webkit-tap-highlight-color: transparent;
}
.wrap { max-width: 1100px; margin: 0 auto; display: grid; gap: 18px; }
@media (min-width: 900px) {
  .wrap { grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); align-items: start; }
  .head { grid-column: 1 / -1; }
}
.head { display: grid; gap: 6px; padding-block: 10px 14px; border-bottom: 1px solid var(--line); }
.brand { margin: 0; line-height: 0; }
.brand img { display: block; height: clamp(16px, 4.6vw, 24px); width: auto; max-width: 100%; }
.brand span { display: none; }
.head p { margin: 0; color: var(--mute); font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; }

/* viewfinder: stays pinned while the look list scrolls underneath */
.view { display: grid; gap: 8px; min-width: 0; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--body); padding-block: 8px 10px; border-bottom: 1px solid var(--line); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--body); }
@media (min-width: 900px) { .view { top: calc(12px + env(safe-area-inset-top, 0px)); border-bottom: 0; } .finder canvas { max-height: 78vh !important; } }
.finder {
  position: relative; background: #000; border: 1px solid var(--line); border-radius: 0;
  display: grid; place-items: center; overflow: hidden; touch-action: pan-y; user-select: none; -webkit-user-select: none;
  min-height: 180px; cursor: grab;
}
.finder canvas { display: block; max-width: 100%; max-height: 44vh; width: auto; height: auto; }
.tag {
  position: absolute; top: 10px; left: 10px; font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em;
  background: rgba(0,0,0,.6); color: var(--fg); padding: 3px 8px; border-radius: 0; text-transform: uppercase; letter-spacing: .14em; pointer-events: none;
}
.tag.r { left: auto; right: 10px; }
.busy { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(0,0,0,.6); text-transform: uppercase; font-family: var(--mono); font-size: 12px; letter-spacing: .08em; }
.hint { color: var(--mute); font-size: 12px; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.strip { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
.strip button { flex: 0 0 auto; width: 52px; height: 52px; padding: 0; border: 1px solid var(--line); border-radius: 0; background: var(--panel); overflow: hidden; cursor: pointer; }
.strip button[aria-current="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.strip img { width: 100%; height: 100%; object-fit: cover; display: block; }

/* controls */
.brands { display: flex; gap: 0; border: 0; border-bottom: 1px solid var(--line); overflow-x: auto; background: none; }
.brands button { flex: 1 0 auto; font: inherit; font-family: var(--mono); font-size: 12px; letter-spacing: .08em; font-weight: 500;
  color: var(--mute); background: none; border: 0; border-bottom: 1px solid transparent; margin-bottom: -1px; padding: 11px 12px; min-height: 44px; cursor: pointer; white-space: nowrap; }
.brands button { flex: 0 0 auto; padding-inline: 0 18px; text-align: left; }
.brands button small { margin-left: 6px; font-size: 10px; opacity: .7; }
.brands button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--fg); }
.ctrl { display: grid; gap: 18px; min-width: 0; }
.label { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.24em; color: var(--mute); text-transform: uppercase; }
.looks { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 14px 8px; }
.look {
  border: 0; background: none; color: var(--mute); border-radius: 0; padding: 0;
  text-align: left; cursor: pointer; overflow: hidden; display: grid; font: inherit;
}
.look canvas { width: 100%; aspect-ratio: 3 / 2; display: block; background: #000; outline: 1px solid transparent; outline-offset: 2px; transition: outline-color .15s; }
.look span { padding: 8px 0 0; font-size: 12px; line-height: 1.3; }
.look small { display: block; font-family: var(--mono); font-size: 9.5px; color: var(--mute); letter-spacing: .12em; text-transform: uppercase; margin-top: 2px; }
.look[aria-pressed="true"] { color: var(--fg); }
.look[aria-pressed="true"] canvas { outline-color: var(--fg); }
.look[aria-pressed="true"] small { color: var(--fg); }
.look:focus-visible, button:focus-visible, input:focus-visible + .track { outline: 2px solid var(--accent); outline-offset: 2px; }

.sliders { display: grid; gap: 0; border-top: 1px solid var(--line); }
.sliders > .row { border-bottom: 1px solid var(--line); }
.row { display: grid; grid-template-columns: 64px minmax(0,1fr) 60px; align-items: center; gap: 10px; min-height: 44px; }
.row label { font-size: 13px; color: var(--mute); }
.row output { font-family: var(--mono); font-size: 12.5px; text-align: right; font-variant-numeric: tabular-nums; color: var(--fg); }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; background: transparent; height: 28px; margin: 0; }
input[type=range]::-webkit-slider-runnable-track { height: 1px; background: #3a3a3a; }
input[type=range]::-moz-range-track { height: 1px; background: #3a3a3a; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: var(--fg); margin-top: -5.5px; border: 0; }
input[type=range]::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: var(--fg); border: 3px solid var(--body); }
input[type=range]:focus-visible::-webkit-slider-thumb { background: var(--accent); }

.toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 56px; border-bottom: 1px solid var(--line); }
.toggle small { display: block; color: var(--mute); font-size: 12px; }
.switch { position: relative; width: 44px; height: 26px; flex: 0 0 auto; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.switch i { position: absolute; inset: 0; border-radius: 13px; background: none; border: 1px solid #4a4a4a; transition: background .15s; pointer-events: none; }
.switch i::after { content: ""; position: absolute; top: 4px; left: 4px; width: 16px; height: 16px; border-radius: 50%; background: var(--mute); transition: transform .15s; }
.switch input:checked + i { background: var(--fg); border-color: var(--fg); }
.switch input:checked + i::after { background: var(--body); }
.switch input:checked + i::after { transform: translateX(18px); }
.switch input:focus-visible + i { outline: 2px solid var(--accent); outline-offset: 2px; }

.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btn {
  font: inherit; font-family: var(--mono); font-weight: 500; font-size: 12px; letter-spacing: .2em; min-height: 52px; border-radius: 0; cursor: pointer;
  border: 1px solid var(--line); background: var(--panel); color: var(--fg); display: grid; place-items: center; position: relative;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn:disabled { opacity: .45; cursor: default; }
.btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.btn.wide, .wide { grid-column: 1 / -1; }
.btn.ghost { border-color: var(--fg); color: var(--fg); }
.shoot { min-height: 50px; font-size: 13px; letter-spacing: .32em; }
.livectl { position: absolute; bottom: 10px; z-index: 2; font: inherit; font-family: var(--mono); font-size: 11px; letter-spacing: .16em; color: var(--fg); background: rgba(0,0,0,.6); border: 1px solid rgba(255,255,255,.25); padding: 8px 12px; min-height: 36px; cursor: pointer; }
.livectl.l { left: 10px; } .livectl.r { right: 10px; }
.flash { position: absolute; inset: 0; background: #fff; opacity: .85; pointer-events: none; animation: flash .25s ease-out forwards; }
@keyframes flash { to { opacity: 0; } }
body.live .tag:first-of-type { color: #ff5a4f; }
.topbtns { display: grid; grid-template-columns: 1.5fr 1fr; gap: 8px; }
.shoot span { display: inline-flex; align-items: center; gap: 10px; }
.dot { width: 12px; height: 12px; border-radius: 50%; background: #c8302a; }
.autos { border-top: 0; }
.reset { font: inherit; font-family: var(--mono); font-size: 10.5px; letter-spacing: .14em; color: var(--mute); background: none; border: 0; cursor: pointer; padding: 4px 0; text-decoration: underline; text-underline-offset: 3px; }
.msg { font-size: 13px; color: var(--mute); min-height: 1.5em; margin: 0; }
.msg.ok { color: var(--fg); }

/* save fallback sheet */
.sheet { position: fixed; inset: 0; background: #000; z-index: 20; display: grid; grid-template-rows: auto minmax(0,1fr) auto auto; gap: 12px;
  padding: calc(14px + env(safe-area-inset-top,0px)) max(16px, env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px)); }
.sheet img { max-width: 100%; max-height: 100%; margin: auto; display: block; object-fit: contain; -webkit-touch-callout: default; }
.sheet p { margin: 0; text-align: center; font-size: 14px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

  // ---------- pixel pipeline ----------
  function conLUT(a){
    const N = 2048, t = new Float32Array(N+1);
    for (let i=0;i<=N;i++){
      const x = i/N;
      t[i] = x < 0.5 ? 0.5*Math.pow(2*x, a) : 1 - 0.5*Math.pow(2-2*x, a);
    }
    return t;
  }
  function chanLUTs(p, adj){
    const ex = Math.pow(2, adj.exp/10), w = adj.warm/10;
    const mul = [ex*(1+0.08*w), ex*(1+0.012*w), ex*(1-0.08*w)];
    const base = [], look = [];
    for (let c=0;c<3;c++){
      const b = new Float32Array(256), l = new Float32Array(256), g = p.gam ? p.gam[c] : 1;
      for (let i=0;i<256;i++){
        let v = Math.min(1, (i/255)*mul[c]);
        b[i] = v; l[i] = g === 1 ? v : Math.pow(v, g);
      }
      base.push(b); look.push(l);
    }
    return { base, look };
  }
  function process(data, w, h, lookId, adj){
    const p = byId[lookId].p;
    const { base, look } = chanLUTs(p, adj);
    const cl = conLUT(p.con), N = 2048;
    const amt = adj.amt/100, gr = adj.grain/100 * 0.16, vig = adj.vig/100 * 0.62;
    const sat = p.sat, rpop = p.rpop, bpop = p.bpop, gsh = p.gsh, bsh = p.bsh, mono = p.mono;
    const sh = p.sh, hi = p.hi, lift = p.lift, span = p.roll - p.lift;
    const cx = (w-1)/2, cy = (h-1)/2;
    const dx2 = new Float32Array(w), dy2 = new Float32Array(h);
    for (let x=0;x<w;x++){ const d=(x-cx)/(cx||1); dx2[x]=d*d; }
    for (let y=0;y<h;y++){ const d=(y-cy)/(cy||1); dy2[y]=d*d; }
    let seed = 0x9e3779b9 ^ (w*31 + h);
    const rnd = () => { seed ^= seed << 13; seed ^= seed >>> 17; seed ^= seed << 5; return (seed >>> 0) / 4294967296; };
    const c = v => v < 0 ? 0 : v > 1 ? 1 : v;
    let i = 0;
    for (let y=0;y<h;y++){
      const ry = dy2[y];
      for (let x=0;x<w;x++, i+=4){
        const R = data[i], G = data[i+1], B = data[i+2];
        const br = base[0][R], bg = base[1][G], bb = base[2][B];
        let r = look[0][R], g = look[1][G], b = look[2][B];
        let l;
        if (mono){
          l = r*mono[0] + g*mono[1] + b*mono[2]; r = g = b = l;
        } else {
          l = 0.299*r + 0.587*g + 0.114*b;
          r = l + (r-l)*sat; g = l + (g-l)*sat; b = l + (b-l)*sat;
          if (rpop){ const rd = r - (g > b ? g : b); if (rd > 0){ r += rd*rpop; g -= rd*rpop*0.25; b -= rd*rpop*0.25; } }
          if (bpop){ const bd = b - (r > g ? r : g); if (bd > 0){ b += bd*bpop; r -= bd*bpop*0.5; } }
          if (gsh){ const gd = g - (r > b ? r : b); if (gd > 0){ r += gd*gsh; b -= gd*gsh*0.5; } }
          if (bsh){ const bd = b - (r > g ? r : g); if (bd > 0){ g += bd*bsh; r -= bd*bsh*0.3; } }
        }
        r = cl[(c(r)*N + 0.5) | 0]; g = cl[(c(g)*N + 0.5) | 0]; b = cl[(c(b)*N + 0.5) | 0];
        l = 0.299*r + 0.587*g + 0.114*b;
        const ws = (1-l)*(1-l)*2, wh = l*l*2;
        r += sh[0]*ws + hi[0]*wh; g += sh[1]*ws + hi[1]*wh; b += sh[2]*ws + hi[2]*wh;
        r = lift + r*span; g = lift + g*span; b = lift + b*span;
        r = br + (r-br)*amt; g = bg + (g-bg)*amt; b = bb + (b-bb)*amt;
        if (vig){ const d = (dx2[x] + ry)*0.5; const f = 1 - vig*d*(0.35+0.65*d); r*=f; g*=f; b*=f; }
        if (gr){ const n = (rnd() + rnd() - 1) * gr * (1 - Math.abs(2*l-1)*0.55); r+=n; g+=n; b+=n; }
        data[i] = c(r)*255 + 0.5; data[i+1] = c(g)*255 + 0.5; data[i+2] = c(b)*255 + 0.5;
      }
    }
  }

  function sampleCanvas(){

  function cropRect(sw, sh){

    return [(sw-cw)/2, (sh-ch)/2, cw, ch];

  function render(src, maxPx, maxEdge){
    const [sw, sh] = dims(src);
    const [sx, sy, cw, ch] = cropRect(sw, sh);
    let s = Math.min(1, Math.sqrt(maxPx/(cw*ch)));
    if (maxEdge) s = Math.min(s, maxEdge/Math.max(cw,ch));
    const w = Math.max(1, Math.round(cw*s)), h = Math.max(1, Math.round(ch*s));
    const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
    const x = cv.getContext('2d', { willReadFrequently: true });
    x.imageSmoothingQuality = 'high';
    x.drawImage(src, sx, sy, cw, ch, 0, 0, w, h);
    return { cv, x, w, h };
  }

  function buildThumbs(){
    if (!THUMB_IMG.complete || !THUMB_IMG.naturalWidth) return;
    const srcCv = THUMB_IMG;
    const tw = 150, th = 100;
    const t = document.createElement('canvas'); t.width = tw; t.height = th;
    const tx = t.getContext('2d', { willReadFrequently: true });
    const s = Math.max(tw/srcCv.naturalWidth, th/srcCv.naturalHeight);
    const w = srcCv.naturalWidth*s, h = srcCv.naturalHeight*s;
    tx.drawImage(srcCv, (tw-w)/2, (th-h)*0.28, w, h);
    const base = tx.getImageData(0,0,tw,th);
    looksEl.querySelectorAll('.look').forEach(b => {
      const l = byId[b.dataset.id];
      const d = new ImageData(new Uint8ClampedArray(base.data), tw, th);
      process(d.data, tw, th, l.id, { amt:100, exp:state.adj.exp, warm:state.adj.warm, grain:0, vig:l.p.vig });
      b.querySelector('canvas').getContext('2d').putImageData(d,0,0);
    });
  }
  function selectLook(id){
    state.look = id;
    state.adj.grain = byId[id].p.grain; state.adj.vig = byId[id].p.vig;
    syncUI(); persist(); draw();
  }

  // ---------- sliders ----------
  const fmt = {
    amt: v => v + '%',
    exp: v => (v>0?'+':v<0?'−':'±') + (Math.abs(v)/10).toFixed(1) + ' EV',
    warm: v => v === 0 ? '0' : (v>0 ? '따뜻 ' : '차갑 ') + Math.abs(v),
    grain: v => v,
    vig: v => v,
  };
  Object.keys(fmt).forEach(k => {
    const s = $('s-'+k);
    s.addEventListener('input', () => {
      state.adj[k] = +s.value; $('o-'+k).textContent = fmt[k](+s.value); draw();
    });
    s.addEventListener('change', () => { persist(); if (k==='exp'||k==='warm') buildThumbs(); });
  });
  function previewCanvasCopy(){ const c=document.createElement('canvas'); c.width=orig.width; c.height=orig.height; c.getContext('2d').putImageData(orig,0,0); return c; }
  $('crop').addEventListener('change', e => { state.crop = e.target.checked; persist(); buildPreviewSource(); draw(); });
  $('reset').addEventListener('click', () => {
    state.adj = { amt:100, exp:0, warm:0, grain:byId[state.look].p.grain, vig:byId[state.look].p.vig };
    syncUI(); persist(); buildThumbs(); draw();
  });
  function syncUI(){
    Object.keys(fmt).forEach(k => { $('s-'+k).value = state.adj[k]; $('o-'+k).textContent = fmt[k](state.adj[k]); });
    $('crop').checked = state.crop;
    $('autosave').checked = state.autosave;
    looksEl.querySelectorAll('.look').forEach(b => { b.setAttribute('aria-pressed', b.dataset.id === state.look); b.hidden = b.dataset.brand !== state.brand; });
    brandsEl.querySelectorAll('button').forEach(b => b.setAttribute('aria-selected', b.dataset.brand === state.brand));
    $('tagR').textContent = tagName(state.look);
  }
  function tagName(id){ const l = byId[id]; return BRANDS.find(b => b.id === l.brand).short + ' · ' + l.name; }
  function persist(){ store.set('settings', { brand: state.brand, look: state.look, adj: state.adj, crop: state.crop, autosave: state.autosave }); }

  // ---------- files ----------
  function loadImg(file){
    return new Promise((res, rej) => {
      const url = URL.createObjectURL(file), im = new Image();
      im.onload = () => res(im); im.onerror = () => rej(new Error('decode')); im.src = url;
    });
  }
  let shotNo = 0;
  async function addFiles(files, append, keepLive){
    if (!files.length) return [];
    setMsg('');
    $('busy').hidden = false;
    const items = [];
    for (const f of files){
      let name = f.name;
      if (append){ shotNo++; const t = new Date(); name = `GR_${String(t.getHours()).padStart(2,'0')}${String(t.getMinutes()).padStart(2,'0')}${String(t.getSeconds()).padStart(2,'0')}_${shotNo}.jpg`; }
      try { items.push({ name, img: await loadImg(f) }); }
      catch(err){ setMsg(`${f.name}을(를) 열지 못했습니다. JPG나 HEIC 사진인지 확인해 주세요.`); }
    }
    $('busy').hidden = true;
    if (!items.length) return [];
    state.items = append ? state.items.concat(items) : items;
    const idx = append ? state.items.length - 1 : 0;
    buildStrip(); selectItem(idx, keepLive);
    return items;
  }
  $('file').addEventListener('change', async e => {
    const files = [...e.target.files]; e.target.value = '';
    if (files.length) stopLive();
    await addFiles(files, false);
  });
  $('cam').addEventListener('change', async e => {
    const files = [...e.target.files]; e.target.value = '';
    const added = await addFiles(files, true);
    if (!added.length) return;
    if (state.autosave) $('save').click();
    else setMsg('촬영한 사진에 룩을 적용했습니다. 마음에 들면 저장하세요.', true);
  });
  // ---------- live viewfinder ----------
  let live = null, liveFailed = false, facing = 'environment';
  const LIVE_EDGE = 720;
  const hasCam = () => !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
  $('shoot').addEventListener('click', () => {
    if (live) { capture(); return; }
    if (!hasCam() || liveFailed) { $('cam').click(); return; }
    startLive();
  });
  async function startLive(auto){
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: { ideal: facing }, width: { ideal: 4032 }, height: { ideal: 3024 } } });
      const v = document.createElement('video');
      v.playsInline = true; v.muted = true; v.setAttribute('playsinline', ''); v.srcObject = stream;
      await v.play();
      live = { stream, v, raf: 0, thumbAt: 0 };
      document.body.classList.add('live');
      $('liveClose').hidden = false; $('liveFlip').hidden = false;
      $('shootLabel').textContent = 'CAPTURE';
      $('tagL').textContent = 'LIVE';
      $('fileInfo').textContent = '룩을 고르며 화면을 확인하고 CAPTURE로 촬영하세요';
      setMsg('');
      liveLoop();
    } catch (err) {
      if (auto){ $('fileInfo').textContent = 'SHOOT를 누르면 실시간 촬영이 시작돼요'; return; }
      liveFailed = true;
      const denied = err && (err.name === 'NotAllowedError' || err.name === 'SecurityError');
      setMsg(denied ? '카메라 권한이 거부됐어요. 아이폰 설정의 Safari 카메라 권한을 허용하거나, SHOOT를 다시 누르면 기본 카메라로 촬영해요.'
                    : '실시간 카메라를 열지 못했어요. SHOOT를 다시 누르면 기본 카메라로 촬영해요.');
    }
  }
  function stopLive(){
    if (!live) return;
    cancelAnimationFrame(live.raf);
    live.stream.getTracks().forEach(t => t.stop());
    live = null;
    document.body.classList.remove('live');
    $('liveClose').hidden = true; $('liveFlip').hidden = true;
    $('shootLabel').textContent = 'SHOOT';
    if (state.cur >= 0) selectItem(state.cur, true);
    else { $('tagL').textContent = 'Changjo'; $('fileInfo').textContent = 'SHOOT로 촬영하거나 IMPORT로 사진을 불러오세요'; buildPreviewSource(); draw(); }
  }
  function liveLoop(){
    if (!live) return;
    const v = live.v;
    if (v.videoWidth){
      const [sx, sy, cw, ch] = cropRect(v.videoWidth, v.videoHeight);
      const k = Math.min(1, LIVE_EDGE / Math.max(cw, ch));
      const w = Math.round(cw*k), h = Math.round(ch*k);
      if (preview.width !== w || preview.height !== h){ preview.width = w; preview.height = h; }
      pctx.drawImage(v, sx, sy, cw, ch, 0, 0, w, h);
      if (!holding){
        const d = pctx.getImageData(0, 0, w, h);
        process(d.data, w, h, state.look, state.adj);
        pctx.putImageData(d, 0, 0);
      }
    }
    live.raf = requestAnimationFrame(liveLoop);
  }
  async function capture(){
    if (!live || !live.v.videoWidth) return;
    const v = live.v, c = document.createElement('canvas');
    c.width = v.videoWidth; c.height = v.videoHeight;
    c.getContext('2d').drawImage(v, 0, 0);
    const f = $('flash'); f.hidden = false; f.style.animation = 'none'; void f.offsetWidth; f.style.animation = '';
    setTimeout(() => { f.hidden = true; }, 260);
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.95));
    c.width = c.height = 1;
    if (!blob) return;
    const added = await addFiles([new File([blob], 'live.jpg', { type: 'image/jpeg' })], true, true);
    if (!added.length) return;
    if (state.autosave) $('save').click();
    else setMsg(`${state.items.length}장 촬영 · 아래 필름 스트립에서 확인하고 SAVE로 저장하세요`, true);
  }
  $('liveClose').addEventListener('click', e => { e.stopPropagation(); stopLive(); });
  $('liveFlip').addEventListener('click', async e => {
    e.stopPropagation();
    facing = facing === 'environment' ? 'user' : 'environment';
    if (live){ cancelAnimationFrame(live.raf); live.stream.getTracks().forEach(t => t.stop()); live = null; }
    await startLive();
  });
  ['pointerdown','pointerup'].forEach(t => { $('liveClose').addEventListener(t, e => e.stopPropagation()); $('liveFlip').addEventListener(t, e => e.stopPropagation()); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) stopLive(); });

  $('autosave').addEventListener('change', e => { state.autosave = e.target.checked; persist(); });
  function buildStrip(){
    const strip = $('strip'); strip.innerHTML = '';
    strip.hidden = state.items.length < 2;
    $('saveAll').hidden = state.items.length < 2;
    $('saveAll').textContent = `SAVE ALL · ${state.items.length}`;
    state.items.forEach((it, i) => {
      const b = document.createElement('button'); b.type='button';
      b.setAttribute('aria-label', `${i+1}번째 사진`);
      const img = document.createElement('img'); img.src = it.img.src; img.alt = '';
      b.appendChild(img); b.addEventListener('click', () => selectItem(i));
      strip.appendChild(b);
    });
  }
  function selectItem(i, keepLive){
    if (live && !keepLive) stopLive();
    state.cur = i;
    $('strip').querySelectorAll('button').forEach((b,k) => b.setAttribute('aria-current', k===i));
    const it = state.items[i], [w,h] = dims(it.img);
    $('tagL').textContent = state.items.length > 1 ? `${i+1} / ${state.items.length}` : 'MY PHOTO';
    const sb = $('strip').children[i]; if (sb) sb.scrollIntoView({ block:'nearest', inline:'nearest' });
    $('fileInfo').textContent = `${it.name} · ${w}×${h}`;
    buildPreviewSource(); draw();
    if (live) $('tagL').textContent = 'LIVE';
  }

  // ---------- save ----------
  let downloads = null;
  (async () => { try { downloads = window.claude ? await window.claude.use('downloads') : null; } catch(e){ downloads = null; } })();

  function setMsg(t, ok){ const m=$('msg'); m.textContent = t; m.className = 'msg' + (ok?' ok':''); }
  const tick = () => new Promise(r => setTimeout(r, 30));

  async function renderFull(idx){
    const src = idx < 0 ? SAMPLE : state.items[idx].img;
    const r = render(src, 16e6);           // iOS canvas limit ≈ 16.7MP
    const d = r.x.getImageData(0,0,r.w,r.h);
    process(d.data, r.w, r.h, state.look, state.adj);
    r.x.putImageData(d,0,0);
    const blob = await new Promise(res => r.cv.toBlob(res, 'image/jpeg', 0.93));
    r.cv.width = r.cv.height = 1;
    return blob;
  }
  function outName(idx){
    const base = idx < 0 ? 'changjo' : state.items[idx].name.replace(/\.[^.]+$/, '');
    return `${base}_GR-${state.look}.jpg`;
  }
  // Gallery save: one tap on SAVE opens the iOS share sheet directly ("이미지 저장" → Photos).
  // If iOS needs a fresh tap (long developing), a one-button sheet asks for it.
  function canShareFiles(files){
    try {
      const f = files || [new File([new Blob(['x'], { type: 'image/jpeg' })], 'x.jpg', { type: 'image/jpeg' })];
      return !!(navigator.share && navigator.canShare && navigator.canShare({ files: f }));
    } catch(e){ return false; }
  }
  let sheetFiles = null, sheetDone = null;
  async function deliver(blobs, names){
    const files = blobs.map((bl, i) => new File([bl], names[i], { type: 'image/jpeg' }));
    if (canShareFiles(files)){
      try { await navigator.share({ files }); return 'saved'; }
      catch(err){ if (err && err.name === 'AbortError') return 'canceled'; }
    }
    return openSheet(blobs, files);
  }
  function openSheet(blobs, files){
    sheetFiles = files;
    $('sheetImg').src = URL.createObjectURL(blobs[0]);
    const can = canShareFiles(files);
    $('sheetSave').hidden = !can; $('sheetSave').disabled = false;
    $('sheetSave').textContent = files.length > 1 ? `SAVE ${files.length} TO PHOTOS` : 'SAVE TO PHOTOS';
    $('sheetHint').innerHTML = can
      ? '버튼을 누르고 <b>‘이미지 저장’</b>을 고르면 앨범에 들어갑니다'
      : '사진을 길게 눌러 <b>‘사진 앱에 추가’</b>를 고르세요';
    $('sheetMsg').textContent = ''; $('sheetMsg').className = 'msg';
    $('sheet').hidden = false;
    return new Promise(res => { sheetDone = res; });
  }
  function closeSheet(result){
    $('sheet').hidden = true;
    const s = $('sheetImg').src; if (s) URL.revokeObjectURL(s); $('sheetImg').removeAttribute('src');
    sheetFiles = null;
    if (sheetDone){ const d = sheetDone; sheetDone = null; d(result); }
  }
  $('sheetSave').addEventListener('click', async () => {
    if (!sheetFiles) return;
    const b = $('sheetSave'); b.disabled = true;
    try { await navigator.share({ files: sheetFiles }); closeSheet('saved'); return; }
    catch(err){
      const m = $('sheetMsg');
      m.textContent = err && err.name === 'AbortError' ? '저장을 취소했습니다.' : '공유 시트를 열 수 없어요. 사진을 길게 눌러 저장해 주세요.';
      m.className = 'msg';
    }
    b.disabled = false;
  });
  $('sheetClose').addEventListener('click', () => closeSheet('closed'));
  function report(r, n){
    setMsg(r === 'saved' ? (n > 1 ? `${n}장을 앨범으로 보냈어요.` : '앨범으로 보냈어요.') : r === 'canceled' ? '저장을 취소했습니다.' : '', r === 'saved');
  }
  $('save').addEventListener('click', async () => {
    const b = $('save'); b.disabled = true; $('busy').hidden = false; setMsg('고해상도로 현상하는 중…');
    await tick();
    try {
      const blob = await renderFull(state.cur);
      $('busy').hidden = true; setMsg('');
      report(await deliver([blob], [outName(state.cur)]), 1);
    } catch(e){ setMsg('사진을 만들지 못했습니다. 다른 사진으로 다시 시도해 주세요.'); }
    $('busy').hidden = true; b.disabled = false;
  });
  $('saveAll').addEventListener('click', async () => {
    const b = $('saveAll'); b.disabled = true; $('save').disabled = true;
    const blobs = [], names = [];
    try {
      for (let i = 0; i < state.items.length; i++){
        setMsg(`${i+1} / ${state.items.length} 현상 중…`); $('busy').hidden = false; await tick();
        blobs.push(await renderFull(i)); names.push(outName(i));
      }
      $('busy').hidden = true; setMsg('');
      report(await deliver(blobs, names), blobs.length);
    } catch(e){ $('busy').hidden = true; setMsg('일부 사진을 만들지 못했습니다. 다시 시도해 주세요.'); }
    b.disabled = false; $('save').disabled = false;
  });

  // ---------- boot ----------
  syncUI();
  buildPreviewSource();
  if (hasCam()){
    preview.width = 900; preview.height = 1200;
    pctx.fillStyle = '#000'; pctx.fillRect(0, 0, 900, 1200);
    $('tagL').textContent = 'LIVE';
    $('fileInfo').textContent = '카메라를 준비하는 중…';
    startLive(true);
  } else draw();
})();
</script>
